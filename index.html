<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slovenske prometne nesreče - Interaktivni zemljevid</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/MarkerCluster.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/MarkerCluster.Default.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="source-banner">
        📊 <span data-i18n="sourceLabel">Vir podatkov:</span> <a href="https://www.policija.si/o-slovenski-policiji/statistika/prometna-varnost" target="_blank" data-i18n="sourcePolice">Slovenska policija - Prometna varnost</a>
    </div>

    <div class="header">
        <h1>🚗 <span data-i18n="title">Zemljevid nesreč</span></h1>
        <div class="header-controls">
            <!-- <button class="language-toggle active" id="langSL" data-lang="sl">SL</button> -->
            <!-- <button class="language-toggle" id="langEN" data-lang="en">EN</button> -->
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
        <p data-i18n="subtitle">Filtriraj po letu, resnosti, vrsti, vremenu in še več</p>
    </div>
    
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="loading" id="loadingMsg">
                <span data-i18n="loading">📂 Nalaganje in dekompresija podatkov...</span>
                <div class="loading-bar">
                    <div class="loading-progress" id="loadingProgress"></div>
                </div>
            </div>
        </div>
        
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/leaflet.markercluster.min.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="src/i18n.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
